<app-navbar></app-navbar>

 <!-- REGISTER Page  -->
<div class="login-page">

    <div class="overlay"></div>

    <div class="login-container">

        <h2>Sign Up</h2>

        <h3>Already have an account?</h3>

        <form [formGroup]="registerForm" (ngSubmit)="register()">

            <div class="form-group">

                <input type="text" class="form-control" placeholder="Fullname" formControlName="fullName">

            </div>

            <div class="form-group">

                <input type="text" class="form-control" placeholder="Username" formControlName="username">

            </div>

            <div class="form-group">

                <input type="email" class="form-control" placeholder="Email" formControlName="email">

            </div>

            <div class="form-group password-box">

                <input [type]="showEyeValue ? 'text' : 'password'" class="form-control" placeholder="Password" formControlName="password">

                <button (click)="showEye()" type="button" class="eye-btn"><i class="fa-solid" [class.fa-eye]="showEyeValue" [class.fa-eye-slash]="!showEyeValue"></i></button>

            </div>

            <div class="form-group password-box">

                <input [type]="showEyeValue ? 'text' : 'password'" class="form-control" placeholder="Confirm Password" formControlName="confirmPassword">

                <button (click)="showEye()" type="button" class="eye-btn"><i class="fa-solid" [class.fa-eye]="showEyeValue" [class.fa-eye-slash]="!showEyeValue"></i></button>

            </div>

            <div class="form-group">

                <input type="tel" class="form-control" placeholder="PhoneNumber" minlength="10" maxlength="15" formControlName="phone">

            </div>

            <div class="form-group">

                <input type="text" class="form-control" placeholder="Occupation" formControlName="occupation">

            </div>

            <button type="submit" class="btn-login">
                SIGN UP
            </button>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

            </div>

            <div class="divider"></div>

            <div class="register-link-container">

                <a
                    routerLink="/login"
                    class="link">

                    <u>Already have an account?</u>

                </a>
            
            </div>

            <section class="social-section">

                <div class="social-icons">

                    <a href="https://www.facebook.com/amalkrishnatj.amal"><i class="fab fa-facebook-f"></i></a>

                    <a href="https://www.instagram.com/amalx047_?igsh=MThpN2twdmw3ZXp4YQ=="><i class="fab fa-instagram"></i></a>

                    <a href="https://x.com/Tssuni536"><i class="fab fa-x-twitter"></i></a>

                    <a href="https://www.linkedin.com/in/amal-undefined-122128429?utm_source=share_via&utm_content=profile&utm_medium=member_android"><i class="fab fa-linkedin-in"></i></a>

                </div>
            
            </section>

        </form>

    </div>

</div>
