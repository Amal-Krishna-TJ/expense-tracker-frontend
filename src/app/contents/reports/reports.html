<app-navbar></app-navbar>

<!-- HERO -->

<section class="hero-section">

    <div class="container">

        <div class="row align-items-center">

            <div class="col-lg-7">

                <h1>Reports & Analytics</h1>

                <p>
                    Generate professional reports of your expenses,
                    budgets and recurring payments.
                </p>

            </div>

            <div class="col-lg-5 text-center">

                <i class="fa-solid fa-file-chart-column hero-icon"></i>

            </div>

        </div>

    </div>

</section>

<div class="container py-5">

    <!-- FILTERS -->

    <div class="filter-card">

        <div class="row g-3">

            <div class="col-md-4">

                <label>Month</label>

                <select
                    class="form-select"
                    [(ngModel)]="selectedMonth">

                    @for(month of months; track month){

                    <option [ngValue]="$index+1">

                        {{month}}

                    </option>

                    }

                </select>

            </div>

            <div class="col-md-4">

                <label>Year</label>

                <select
                    class="form-select"
                    [(ngModel)]="selectedYear">

                    @for(year of years; track year){

                    <option [value]="year">

                        {{year}}

                    </option>

                    }

                </select>

            </div>

            <div class="col-md-4 d-flex align-items-end">

                <button
                    class="btn btn-warning w-100"
                    (click)="loadReport()">

                    <i class="fa-solid fa-filter"></i>

                    Generate Report

                </button>

            </div>

        </div>

    </div>

    <!-- REPORT CARDS -->

    <div class="row g-4 mt-3">

        <div class="col-lg-6">

            <div class="report-card">

                <i class="fa-solid fa-file-pdf report-icon"></i>

                <h4>Expense Report</h4>

                <p>
                    Download your monthly expense report.
                </p>

                <button
                    class="btn btn-danger"
                    (click)="downloadPDF()">

                    Download PDF

                </button>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="report-card">

                <i class="fa-solid fa-file-excel report-icon"></i>

                <h4>Expense Report</h4>

                <p>
                    Export all data to Excel.
                </p>

                <button
                    class="btn btn-success"
                    (click)="downloadExcel()">

                    Download Excel

                </button>

            </div>

        </div>

    </div>

    <div class="row mt-5">

        <div class="col-lg-6">
        
            <div class="report-card zoomIn">
            
                <h4>Category Distribution</h4>
            
                <canvas
                    id="expensePieChart"
                    baseChart
                    [data]="pieChartData"
                    [type]="pieChartType"
                    [options]="pieChartOptions">
            
                </canvas>
            
            </div>
        
        </div>
    
        <div class="col-lg-6">
        
            <div class="report-card zoomIn">
            
                <h4>Monthly Expenses</h4>
            
                <canvas
                    id="expenseBarChart"
                    baseChart
                    [data]="barChartData"
                    [type]="barChartType"
                    [options]="barChartOptions">
            
                </canvas>
            
            </div>
        
        </div>
    
    </div>

    <div class="row mt-4">
    
        <div class="col-lg-12">
        
            <div class="report-card zoomIn">
            
                <h4>Expense Trend</h4>
            
                <canvas
                    id="expenseLineChart"
                    baseChart
                    [data]="lineChartData"
                    [type]="lineChartType"
                    [options]="lineChartOptions">
            
                </canvas>
            
            </div>
        
        </div>
    
    </div>

</div>
